name: ci-check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Check
        run: mise run check

      - name: Check skip policy
        shell: pwsh
        run: ./.github/scripts/test-check-skips.ps1

      - name: Check (internals feature)
        run: mise run check-internals

      - name: Build
        run: mise run build

      - name: Doc
        run: mise run doc

      - name: Package dry run
        run: mise run package

      - name: Build benchmarks
        run: mise run bench-build

  # One test job per architecture, on separate runners, so the 32-bit tests (a cold i686 build,
  # slower 32-bit code, one test thread) do not add to the 64-bit ones.
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            task: test
          - arch: x86
            task: test-32
    env:
      # The property tests still run; only their coverage counts are skipped: how far a timed
      # search gets depends on the runner's speed, and CI must not fail by chance.
      ARBTEST_COVERAGE: "off"

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      # The integration tests need an explicit volume and refuse the system drive
      # (tests/common/mod.rs). The checkout lives on the runner's workspace drive
      # (D: on windows-latest), not the system drive, so the allow flag is set only if that
      # changes; the runner is disposable either way. Tests on the live C: would make the record
      # reuse and strict invariants tests flaky, so the drive is printed to tell a flaky run apart.
      - name: Select the test volume and enable its USN journal
        shell: pwsh
        run: |
          $drive = ($env:GITHUB_WORKSPACE -split ':')[0]
          $system = ($env:SystemDrive -split ':')[0]
          "NTFS_READER_TEST_VOLUME=$drive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($drive -ieq $system) {
            "NTFS_READER_ALLOW_SYSTEM_DRIVE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::warning::the workspace is on the system drive: the integration tests run on the live ${system}: volume"
          }
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "NTFS_READER_TEST_VOLUME=$drive (system drive: $system)"
          Get-Volume -DriveLetter $drive | Format-List DriveLetter, FileSystemType, Size, SizeRemaining
          fsutil fsinfo ntfsinfo "${drive}:" | Select-String "Bytes Per Cluster"
          fsutil usn createjournal "${drive}:"

      # A test that cannot check what it needs prints `SKIPPED: <test>: <why>` and, with
      # NTFS_READER_SKIP_LOG set, appends that line to the file (libtest hides passing-test
      # output, so a skip would look like a pass otherwise). NTFS_READER_ALLOW_FSUTIL and
      # NTFS_READER_REQUIRE_ALL stay unset: their tests fill volumes for minutes and change
      # system wide settings, so they run on the maintainer's VM instead. The four shadow tests
      # also skip: this job does not create a VSS shadow. check-skips.ps1 names all 13 expected skips.
      - name: Test (${{ matrix.arch }})
        env:
          NTFS_READER_SKIP_LOG: ${{ runner.temp }}\skips-${{ matrix.arch }}.txt
        run: mise run ${{ matrix.task }}

      # Compare named skips for this architecture; a missing fixture or a newly skipped test
      # must not hide behind an unchanged count. Partial logs after failed jobs are printed only.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./.github/scripts/check-skips.ps1 -LogDirectory $env:RUNNER_TEMP -JobStatus $env:JOB_STATUS -Architectures ${{ matrix.arch }}

  # Type-checks what the Windows job cannot run: the `internals` feature natively.
  check-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Check internals feature
        run: mise run check-linux

  msrv:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Check on the minimum supported Rust version
        run: mise run check-msrv
